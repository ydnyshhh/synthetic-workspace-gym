[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "synthetic-workspace-gym"
version = "0.2.0.dev1"
description = "Synthetic environment generation and evaluation infrastructure for workspace-style agent research."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yadnyesh Chakane" }]
license = "Apache-2.0"
keywords = ["agent", "evaluation", "reinforcement-learning", "verifiers", "workspace"]
tags = ["agent", "workspace", "tool-use", "train", "eval"]
dependencies = []

[project.optional-dependencies]
verifiers = [
    "harnesses==0.1.1",
    "verifiers==0.1.15.dev187",
    "prime-sandboxes>=0.2.26,<0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.15.21",
]

[project.scripts]
swg = "synthetic_workspace_gym.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_workspace_gym"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 1
