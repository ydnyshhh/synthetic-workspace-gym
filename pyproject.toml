[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "synthetic-workspace-gym"
version = "0.1.6"
description = "Synthetic environment generation and evaluation infrastructure for workspace-style agent research."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yadnyesh Chakane" }]
keywords = ["agent", "evaluation", "reinforcement-learning", "verifiers", "workspace"]
tags = ["agent", "workspace", "tool-use", "train", "eval"]
dependencies = [
    "verifiers>=0.1.14",
]

[project.optional-dependencies]
verifiers = [
    "verifiers>=0.1.14",
]

[project.scripts]
swg = "synthetic_workspace_gym.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_workspace_gym"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 1
