[project]
name = "synthetic-workspace-gym"
version = "0.1.1"
description = "Native Verifiers V1 workspace tasks for training terminal agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yadnyesh Chakane" }]
tags = ["multi-turn", "tool-use", "workspace", "code", "v1"]
dependencies = [
    "verifiers>=0.3.0,<0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthetic_workspace_gym"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]
