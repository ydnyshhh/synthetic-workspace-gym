model = "Qwen/Qwen3.5-4B"
loss = "rl"
max_steps = 200
batch_size = 128
rollouts_per_example = 8

[sampling]
max_tokens = 1024
temperature = 0.7

[checkpoints]
interval = 25
keep_cloud = 8

[adapters]
interval = 25
keep_last = 8

[[env]]
id = "yadnyesh/synthetic-workspace-gym@0.2.0.dev1"

[env.args]
frozen_manifest = "train-specialist-script_repair"
split = "train"
max_examples = 512
max_turns = 25
max_tool_steps = 64
reward_mode = "score"
sample_strategy = "first"
shuffle = false
